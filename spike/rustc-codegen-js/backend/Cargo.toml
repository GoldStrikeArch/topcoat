[package]
name = "rustc_codegen_js"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["dylib"]

[dependencies]
# The relooper: rebuilds structured control flow out of the MIR block graph (cfg_adapter.rs).
structurizer = { path = "../structurizer" }
# The CGU "object file" footer: a base64 encoded, postcard serialized item table.
base64 = "0.23.0"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
serde = { version = "1.0.229", features = ["derive"] }
# Reading the `ar` archives rustc packs rlibs into, at link time.
object = { version = "0.39.1", default-features = false, features = ["read", "std", "archive"] }

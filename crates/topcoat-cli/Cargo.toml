[package]
name = "topcoat-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
default-run = "topcoat"

[[bin]]
name = "topcoat"
path = "src/bin/topcoat.rs"

[[bin]]
name = "cargo-topcoat"
path = "src/bin/cargo_topcoat.rs"

[features]
default = []

# The `topcoat client` command and the client build phase of `topcoat dev`,
# which compile a client crate to JavaScript with the `rustc_codegen_js` spike.
#
# Off by default, and it has to stay off in a release: `jsc-build` is a path
# dependency with no published version, and crates.io rejects a manifest naming
# one even behind a feature. Publishing the CLI means dropping this dependency
# (or publishing `jsc-build` first).
client = ["dep:jsc-build"]

[dependencies]
topcoat-asset = { workspace = true, features = ["bundler"] }
topcoat-core = { workspace = true, features = ["build"] }
topcoat-core-grammar = { workspace = true, features = ["pretty"] }
topcoat-font-grammar = { workspace = true, features = ["fontsource", "pretty"] }
topcoat-mail-grammar = { workspace = true, features = ["pretty"] }
topcoat-router = { workspace = true, features = ["websocket"] }
topcoat-ui.workspace = true
topcoat-view-grammar = { workspace = true, features = ["pretty"] }

jsc-build = { workspace = true, optional = true }

clap = { workspace = true, features = ["derive"] }
console.workspace = true
dialoguer.workspace = true
futures-util.workspace = true
glob.workspace = true
ignore.workspace = true
indicatif.workspace = true
notify.workspace = true
proc-macro2 = { workspace = true, features = ["span-locations"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
syn.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process", "signal", "io-util", "time", "sync"] }

[dev-dependencies]
topcoat.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.cargo-udeps.ignore]
development = ["topcoat"]
